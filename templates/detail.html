<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#A149FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI行情监控">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>监控对象详情 - AI行情监控</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root { --bg:#1B1C31; --p:#A149FF; --s:#FD3AFF; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:#E0E0E0; min-height:100vh; position:relative; }
body::before { content:""; position:fixed; top:0;left:0;right:0;bottom:0; background:radial-gradient(ellipse at 20% 15%,rgba(161,73,255,.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 30%,rgba(253,58,255,.08) 0%,transparent 50%); pointer-events:none; z-index:0; }
body::after { content:""; position:fixed; top:0;left:0;right:0;bottom:0; background-image:linear-gradient(rgba(161,73,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(161,73,255,.025) 1px,transparent 1px); background-size:80px 80px; pointer-events:none; z-index:0; }

.header { position:relative; z-index:10; background:linear-gradient(180deg,rgba(27,28,49,.98) 0%,rgba(27,28,49,.92) 100%); border-bottom:1px solid rgba(161,73,255,.15); padding:14px 25px; display:flex; justify-content:space-between; align-items:center; }
.header::after { content:""; position:absolute; bottom:-1px; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--s),var(--p),transparent); opacity:.7; }
.header h2 { font-size:18px; color:#E0E0E0; }
.btn { padding:8px 18px; border:1px solid rgba(161,73,255,.3); border-radius:6px; cursor:pointer; font-size:13px; background:transparent; color:var(--p); transition:all .2s; text-decoration:none; font-weight:600; }
.btn:hover { background:rgba(161,73,255,.08); border-color:var(--p); }

.content { position:relative; z-index:5; padding:20px 25px; max-width:1400px; margin:0 auto; }
.obj-info { background:linear-gradient(180deg,rgba(27,28,49,.85) 0%,rgba(27,28,49,.6) 100%); border-radius:10px; padding:22px; border:1px solid rgba(161,73,255,.07); margin-bottom:18px; }
.obj-info h3 { color:#E0E0E0; font-size:20px; margin-bottom:10px; }
.obj-info .meta { display:flex; gap:25px; flex-wrap:wrap; }
.obj-info .meta-item { font-size:13px; color:rgba(224,224,224,.45); }
.obj-info .meta-item span { color:var(--p); font-weight:700; }

.current-prices { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
.current-price-card { background:linear-gradient(180deg,rgba(27,28,49,.85) 0%,rgba(27,28,49,.6) 100%); border-radius:10px; padding:14px 20px; border:1px solid rgba(161,73,255,.07); min-width:150px; position:relative; overflow:hidden; }
.current-price-card::before { content:""; position:absolute; left:0; top:15%; bottom:15%; width:3px; border-radius:0 3px 3px 0; background:linear-gradient(180deg,var(--p),var(--s)); }
.current-price-card .ptype { font-size:11px; color:rgba(224,224,224,.35); padding-left:4px; }
.current-price-card .pval { font-size:22px; font-weight:800; color:var(--p); margin-top:4px; padding-left:4px; text-shadow:0 0 8px rgba(161,73,255,.2); }
.current-price-card .punit { font-size:11px; color:rgba(224,224,224,.35); padding-left:4px; }

.period-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.period-tab { padding:9px 22px; border:1px solid rgba(161,73,255,.12); border-radius:6px; cursor:pointer; font-size:13px; background:rgba(27,28,49,.5); color:rgba(224,224,224,.45); font-weight:600; transition:all .2s; }
.period-tab:hover { border-color:var(--p); color:var(--p); }
.period-tab.active { background:linear-gradient(135deg,var(--p),var(--s)); color:#fff; border-color:transparent; }

.chart-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
.chart-box { background:linear-gradient(180deg,rgba(27,28,49,.85) 0%,rgba(27,28,49,.6) 100%); border-radius:10px; padding:16px; border:1px solid rgba(161,73,255,.07); }
.chart-box.full { grid-column:1/-1; }
.chart-box h4 { font-size:14px; color:#E0E0E0; margin-bottom:10px; font-weight:700; }
.chart-inner { width:100%; height:320px; }

.stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:16px; }
.stat-mini { background:linear-gradient(180deg,rgba(27,28,49,.85) 0%,rgba(27,28,49,.6) 100%); border-radius:10px; padding:12px 16px; border:1px solid rgba(161,73,255,.07); }
.stat-mini .s-label { font-size:11px; color:rgba(224,224,224,.35); }
.stat-mini .s-val { font-size:15px; font-weight:700; color:#E0E0E0; margin-top:4px; }
.stat-mini .s-change { font-size:12px; margin-top:3px; }
.s-up { color:#10b981; } .s-down { color:#ff4757; }

.back-link { display:inline-flex; align-items:center; gap:5px; color:rgba(224,224,224,.35); text-decoration:none; font-size:13px; margin-bottom:14px; font-weight:600; }
.back-link:hover { color:var(--p); }
</style>
</head>
<body>
<div class="header"><h2>监控对象详情</h2><div style="display:flex;gap:8px;"><a href="/dashboard" class="btn">大屏</a><a href="/" class="btn">← 返回</a></div></div>
<div class="content">
<a href="/" class="back-link">← 返回驾驶舱</a>
<div class="obj-info" id="objInfo"></div><div class="current-prices" id="currentPrices"></div><div class="period-tabs" id="periodTabs"></div><div class="chart-row" id="trendCharts"></div><div class="stats-grid" id="statsGrid"></div>
</div>
<script>
const objId={{obj_id}},B="",P=[{label:"近7天",days:7},{label:"近30天",days:30},{label:"近90天",days:90},{label:"近365天",days:365}];let cp=3;
async function a(u){const r=await fetch(B+u);return r.json()}
function rpt(){document.getElementById("periodTabs").innerHTML=P.map((p,i)=>`<div class="period-tab ${i===cp?"active":""}" onclick="sp(${i})">${p.label}</div>`).join("")}
function sp(i){cp=i;rpt();ld()}
function cs(t){const s=[];for(const[k,pt]of Object.entries(t)){if(pt.length<2)continue;const v=pt.map(p=>p.value),f=v[0],l=v[v.length-1],c=l-f,pct=f!==0?c/f*100:0;s.push({ptype:k,first:f,last:l,change:c,changePct:pct,min:Math.min(...v),max:Math.max(...v),avg:v.reduce((a,b)=>a+b,0)/v.length})}return s}
async function ld(){const d=P[cp].days,data=await a(`/api/trend/${objId}?days=${d}`),obj=data.object,tr=data.trends;if(!obj){document.getElementById("objInfo").innerHTML='<p style="color:#ff4757;">对象不存在</p>';return}
const cm={gpu:"GPU硬件",llm_intl:"国际大模型",llm_domestic:"国内大模型",other:"其他"};
document.getElementById("objInfo").innerHTML=`<h3>${obj.name}</h3><div class="meta"><div class="meta-item">类别：<span>${cm[obj.category]||obj.category}</span></div><div class="meta-item">区域：<span>${obj.region}</span></div><div class="meta-item">价格单位：<span>${obj.unit}</span></div><div class="meta-item">子分类：<span>${obj.subcategory||"-"}</span></div></div>`;
let ph="";for(const[k,pt]of Object.entries(tr)){if(pt.length>0){const l=pt[pt.length-1];ph+=`<div class="current-price-card"><div class="ptype">${k}</div><div class="pval">${l.value.toFixed(2)}</div><div class="punit">${obj.unit||""}</div></div>`}}document.getElementById("currentPrices").innerHTML=ph;
const tk=Object.keys(tr),cc=document.getElementById("trendCharts");cc.innerHTML="";tk.forEach((pt,i)=>{cc.innerHTML+=`<div class="chart-box${tk.length===1?" full":""}"><h4>${pt} - 价格趋势</h4><div class="chart-inner" id="chart_${i}"></div></div>`});
tk.forEach((pt,i)=>{const pts=tr[pt],c=echarts.init(document.getElementById("chart_"+i));c.setOption({tooltip:{trigger:"axis"},grid:{left:"8%",right:"5%",top:"10%",bottom:"12%"},xAxis:{type:"category",data:pts.map(p=>p.date),axisLabel:{color:"rgba(224,224,224,.35)",fontSize:9,rotate:pts.length>30?45:0},axisLine:{lineStyle:{color:"rgba(161,73,255,.1)"}}},yAxis:{type:"value",axisLabel:{color:"rgba(224,224,224,.35)",fontSize:10},splitLine:{lineStyle:{color:"rgba(161,73,255,.04)"}}},series:[{name:pt,type:"line",data:pts.map(p=>p.value),smooth:true,symbol:"none",lineStyle:{color:"#A149FF",width:2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"rgba(161,73,255,.25)"},{offset:1,color:"transparent"}])}}]})});
const stats=cs(tr);document.getElementById("statsGrid").innerHTML=stats.map(s=>`<div class="stat-mini"><div class="s-label">${s.ptype}</div><div class="s-val">现价 ${s.last.toFixed(2)}</div><div class="s-change ${s.change>=0?"s-up":"s-down"}">变动 ${s.change>=0?"+":""}${s.change.toFixed(2)} (${s.changePct>=0?"+":""}${s.changePct.toFixed(1)}%)</div><div class="s-change" style="color:rgba(224,224,224,.35);">区间 ${s.min.toFixed(2)} ~ ${s.max.toFixed(2)} | 均值 ${s.avg.toFixed(2)}</div></div>`).join("");window.addEventListener("resize",()=>{tk.forEach((_,i)=>{const c=echarts.getInstanceByDom(document.getElementById("chart_"+i));if(c)c.resize()})})}
rpt();ld();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/sw.js").then(() => console.log("SW registered"));
}
</script>
</body>
</html>
